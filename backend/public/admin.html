<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FlexNet Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }

    /* Login */
    .login-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .login-box { background:#fff; padding:40px; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,0.1); width:360px; }
    .login-box h2 { margin-bottom:20px; text-align:center; }
    .login-box input { width:100%; padding:10px 12px; margin-bottom:12px; border:1px solid #ddd; border-radius:6px; font-size:14px; }
    .login-box button { width:100%; padding:10px; background:#4f46e5; color:#fff; border:none; border-radius:6px; font-size:15px; cursor:pointer; }
    .login-box button:hover { background:#4338ca; }
    .login-box .error { color:#dc2626; font-size:13px; margin-bottom:8px; text-align:center; }

    /* Dashboard */
    .dash { max-width:1100px; margin:0 auto; padding:24px; }
    .dash-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
    .dash-header h1 { font-size:22px; }
    .dash-header button { padding:8px 16px; background:#ef4444; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:13px; }
    .dash-header button:hover { background:#dc2626; }

    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; }
    .stat-card { background:#fff; padding:20px; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,0.08); }
    .stat-card .label { font-size:13px; color:#888; margin-bottom:4px; }
    .stat-card .value { font-size:28px; font-weight:700; }

    .actions { display:flex; gap:12px; margin-bottom:20px; }
    .btn { padding:10px 20px; border:none; border-radius:6px; font-size:14px; cursor:pointer; }
    .btn-primary { background:#4f46e5; color:#fff; }
    .btn-primary:hover { background:#4338ca; }
    .btn-danger { background:#ef4444; color:#fff; }
    .btn-danger:hover { background:#dc2626; }

    /* Table */
    .table-wrap { background:#fff; border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,0.08); overflow:hidden; }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:12px 16px; text-align:left; border-bottom:1px solid #eee; font-size:14px; }
    th { background:#f8f9fa; font-weight:600; color:#555; }
    tr:hover { background:#fafafa; }
    .actions-cell { display:flex; gap:8px; }
    .actions-cell a, .actions-cell button { padding:5px 12px; border-radius:4px; font-size:12px; text-decoration:none; cursor:pointer; border:none; }
    .btn-dl { background:#e0e7ff; color:#4f46e5; }
    .btn-dl:hover { background:#c7d2fe; }
    .btn-del { background:#fee2e2; color:#dc2626; }
    .btn-del:hover { background:#fecaca; }

    .empty { text-align:center; padding:40px; color:#aaa; }

    /* Modal */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); align-items:center; justify-content:center; z-index:100; }
    .modal-overlay.active { display:flex; }
    .modal { background:#fff; padding:28px; border-radius:12px; width:400px; }
    .modal h3 { margin-bottom:16px; }
    .modal p { margin-bottom:20px; color:#666; }
    .modal-btns { display:flex; gap:10px; justify-content:flex-end; }
    .modal-btns button { padding:8px 20px; border:none; border-radius:6px; cursor:pointer; }
    .btn-cancel { background:#e5e7eb; }
    .btn-confirm-del { background:#ef4444; color:#fff; }

    @media (max-width: 700px) {
      .stats { grid-template-columns: 1fr; }
      th, td { padding: 8px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>

<!-- Login -->
<div id="login-view" class="login-wrap">
  <div class="login-box">
    <h2>FlexNet Admin</h2>
    <div id="login-error" class="error" style="display:none;"></div>
    <input type="text" id="inp-user" placeholder="Username" autocomplete="username"/>
    <input type="password" id="inp-pass" placeholder="Password" autocomplete="current-password"/>
    <button onclick="doLogin()">Login</button>
  </div>
</div>

<!-- Dashboard -->
<div id="dash-view" class="dash" style="display:none;">
  <div class="dash-header">
    <h1>FlexNet Data Dashboard</h1>
    <button onclick="doLogout()">Logout</button>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="label">Total Submissions</div>
      <div class="value" id="stat-total">-</div>
    </div>
    <div class="stat-card">
      <div class="label">Rule Shift</div>
      <div class="value" id="stat-rule">-</div>
    </div>
    <div class="stat-card">
      <div class="label">Today</div>
      <div class="value" id="stat-today">-</div>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="downloadAll()">📥 Download All (Merged CSV)</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Subject ID</th>
          <th>Filename</th>
          <th>Date</th>
          <th>Size</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="submissions-tbody">
        <tr><td colspan="5" class="empty">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Delete Modal -->
<div id="del-modal" class="modal-overlay">
  <div class="modal">
    <h3>Delete Submission</h3>
    <p id="del-msg">Are you sure?</p>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeDelModal()">Cancel</button>
      <button class="btn-confirm-del" id="del-confirm-btn">Delete</button>
    </div>
  </div>
</div>

<script>
  // Check session
  fetch("/api/admin/check").then(r => r.json()).then(d => {
    if (d.authenticated) showDash();
  });

  async function doLogin() {
    const user = document.getElementById("inp-user").value.trim();
    const pass = document.getElementById("inp-pass").value;
    const errEl = document.getElementById("login-error");
    try {
      const r = await fetch("/api/admin/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username: user, password: pass})
      });
      if (r.ok) { showDash(); loadSubmissions(); }
      else { const d = await r.json(); errEl.textContent = d.error || "Login failed"; errEl.style.display = "block"; }
    } catch(e) { errEl.textContent = "Network error"; errEl.style.display = "block"; }
  }

  // Enter key
  document.getElementById("inp-pass").addEventListener("keydown", e => { if(e.key === "Enter") doLogin(); });

  async function doLogout() {
    await fetch("/api/admin/logout", {method:"POST"});
    document.getElementById("dash-view").style.display = "none";
    document.getElementById("login-view").style.display = "flex";
  }

  function showDash() {
    document.getElementById("login-view").style.display = "none";
    document.getElementById("dash-view").style.display = "block";
    loadSubmissions();
  }

  async function loadSubmissions() {
    try {
      const r = await fetch("/api/admin/submissions");
      if (r.status === 401) { doLogout(); return; }
      const d = await r.json();

      document.getElementById("stat-total").textContent = d.total;

      // Count today
      const today = new Date().toISOString().slice(0,10);
      const todayCount = d.submissions.filter(s => s.created.slice(0,10) === today).length;
      document.getElementById("stat-today").textContent = todayCount;

      // For rule count, we'd need to read files — approximate from subject count
      document.getElementById("stat-rule").textContent = "-";

      const tbody = document.getElementById("submissions-tbody");
      if (d.submissions.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">No submissions yet</td></tr>';
        return;
      }

      tbody.innerHTML = d.submissions.map(s => `
        <tr>
          <td><code>${esc(s.subjectId)}</code></td>
          <td>${esc(s.filename)}</td>
          <td>${new Date(s.created).toLocaleString()}</td>
          <td>${formatBytes(s.size)}</td>
          <td class="actions-cell">
            <a class="btn-dl" href="/api/admin/download/${esc(s.filename)}" download>CSV</a>
            <button class="btn-del" onclick="confirmDel('${esc(s.filename)}', '${esc(s.subjectId)}')">Delete</button>
          </td>
        </tr>
      `).join("");
    } catch(e) {
      console.error(e);
    }
  }

  function downloadAll() {
    window.location.href = "/api/admin/download-all";
  }

  // Delete modal
  let delTarget = "";
  function confirmDel(filename, subjectId) {
    delTarget = filename;
    document.getElementById("del-msg").textContent = `Delete submission ${subjectId}? This cannot be undone.`;
    document.getElementById("del-modal").classList.add("active");
    document.getElementById("del-confirm-btn").onclick = async () => {
      await fetch("/api/admin/submissions/" + delTarget, {method:"DELETE"});
      closeDelModal();
      loadSubmissions();
    };
  }
  function closeDelModal() {
    document.getElementById("del-modal").classList.remove("active");
  }

  // Helpers
  function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function formatBytes(b) { if (b < 1024) return b + " B"; return (b/1024).toFixed(1) + " KB"; }
</script>
</body>
</html>
