services:
  - type: web
    name: flexnet-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: UPLOAD_TOKEN
        generateValue: true
      - key: ADMIN_USER
        value: admin
      - key: SESSION_SECRET
        generateValue: true
      # ⚠️ 重要：部署后去 Render Dashboard → Environment 设置以下两个变量：
      # ADMIN_PASS_HASH: 运行 node -e "const c=require('crypto'); console.log(c.scryptSync('你的密码','flexnet_salt',64).toString('hex'))"
      # UPLOAD_TOKEN: 自定义一个安全 token，要和前端一致
